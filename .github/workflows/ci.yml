name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs write access to the repo.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    env:
      # rustc warnings are errors: main is warning-clean today, and this is what
      # catches dead code, unused imports and the like before they land.
      # Note this is rustc only -- clippy is handled separately below.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      # reqwest is built against native-tls, which needs OpenSSL headers.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # --locked fails if Cargo.lock would need updating, so a dependency bump
      # can't slip in silently during CI.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      # Deliberately NOT `-D warnings`: the tree currently carries 29 clippy
      # lints (all stylistic -- collapsible_if, needless_borrow, for_kv_map and
      # similar). This job fails on genuine clippy errors today; flip it to
      # `-D warnings` once those are cleared.
      - name: Clippy
        run: cargo clippy --locked --all-targets
