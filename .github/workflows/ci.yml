name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs write access to the repo.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    env:
      # rustc warnings are errors: main is warning-clean today, and this is what
      # catches dead code, unused imports and the like before they land.
      # Note this is rustc only -- clippy is handled separately below.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      # reqwest is built against native-tls, which needs OpenSSL headers.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # --locked fails if Cargo.lock would need updating, so a dependency bump
      # can't slip in silently during CI.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets

      # The `python` feature is advertised in Cargo.toml and in the crate-level docs but
      # was built by nothing, so it rotted: a field added to `HttpResponse` was never
      # mirrored in src/python.rs and `cargo build --features python` failed for months
      # while CI stayed green. This step is the fix for that class of rot.
      #
      # A step in this job rather than a job of its own: it wants the same apt packages,
      # the same toolchain and -- most importantly -- the same target/ directory, which
      # this job already caches. A separate job would install and cache all of it twice,
      # and the two caches would fight over the same key prefix, for a build that only
      # adds pyo3 on top of a tree this job has already compiled.
      #
      # `build --lib`, deliberately, not `test` and not `--all-targets`: pyo3 is pulled in
      # with the "extension-module" feature, which tells it NOT to link against libpython
      # (the interpreter supplies those symbols at import time). A shared library may
      # carry undefined symbols, so the cdylib links fine; an executable -- the test
      # harness, or the `rustywap` binary -- may not, and would fail at link time for
      # reasons that have nothing to do with the code being wrong. Compiling the library
      # is what catches the drift this step exists to catch.
      - name: Build python feature
        run: cargo build --locked --lib --features python

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo registry and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      # Deliberately NOT `-D warnings`: the tree currently carries 29 clippy
      # lints (all stylistic -- collapsible_if, needless_borrow, for_kv_map and
      # similar). This job fails on genuine clippy errors today; flip it to
      # `-D warnings` once those are cleared.
      - name: Clippy
        run: cargo clippy --locked --all-targets
